name: dsh-harness

networks:
  default:
    name: dsh-harness_default
    ipam: {}
    external: false

services:
  dsh:
    command: null
    container_name: dsh-harness
    deploy:
      resources:
        limits:
          memory: 4GB
          cpus: "1.00"
        reservations:
          memory: 256MB
          cpus: "0.00"
      placement: {}
    entrypoint: null
    environment:
      OPENAI_API_KEY: ollama-local-dummy
      # Optional: Proxy Authentication
      # PROXY_USERNAME: your_proxy_username
      # PROXY_PASSWORD: your_proxy_password
    image: ghcr.io/smanx/deepseek-harness:latest
    labels:
      icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/deepseek.png
    networks:
      - default
    ports:
      - mode: ingress
        target: 3080
        published: "3080"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/dsh-harness
        target: /root/.dsh
      - type: bind
        source: /DATA/Documents
        target: /workspace/Documents
      - type: bind
        source: /DATA/Downloads
        target: /workspace/Downloads
      - type: bind
        source: /DATA/Media
        target: /workspace/Media
      - type: bind
        source: /DATA/Gallery
        target: /workspace/Gallery
      - type: bind
        source: /media/ZimaOS-HD
        target: /zimaos

